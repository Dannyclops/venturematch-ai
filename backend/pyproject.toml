[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "venturematch-backend"
version = "0.1.0"
description = "Backend and agent services for VentureMatch AI"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    "openai>=3.29,<4",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

